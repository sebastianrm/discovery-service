server:
  port: ${SERVER_PORT:8761}
spring:
  application:
    name: discovery-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL}
  doc:
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
      operations-sorter: alpha
      tags-sorter: alpha
    api-docs:
      path: /v3/api-docs
      enabled: true
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:discovery-service}
    prefer-ip-address: true
  server:
    wait-time-in-ms-when-sync-empty: 0
    response-cache-update-interval-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
logging:
  config: classpath:logback-spring.xml
  level:
    # Discovery Service - niveles por capa
    com.yanki.discovery: DEBUG
    com.yanki.discovery.interfaces.rest.controller: INFO
    com.yanki.discovery.domain.service: DEBUG
    com.yanki.discovery.infrastructure.adapter: DEBUG
    com.yanki.discovery.interfaces.rest.exception: WARN
    # Eureka Server interno
    com.netflix.discovery: WARN
    com.netflix.eureka: INFO
    # Spring Framework
    org.springframework: WARN
    org.springframework.web: INFO
    org.springframework.boot.actuate: INFO
    # Spring Cloud
    org.springframework.cloud: WARN
    # Kafka
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    # Reactor
    reactor: WARN
    # SpringDoc/Swagger
    org.springdoc: DEBUG
