openapi: 3.2.1
info:
  title: Yanki Discovery Service - Eureka Server API
  version: 1.0.0
  description: |
    API REST del servidor Eureka para Service Discovery de la plataforma bancaria Yanki.
    
    ## Funcionalidades principales
    * **Registry**: Consulta de servicios e instancias registradas
    * **Protocol**: Endpoints internos para clientes Eureka (registro, heartbeat, desregistro)
    * **Health**: Health checks compatibles con Spring Boot Actuator
    * **Metadata**: Soporte para metadata rica (version, zone, api.version, canary, weighted routing)
    * **HA Cluster**: Configuración de alta disponibilidad 3 nodos peer-to-peer
    * **Self-Preservation**: Modo protección contra evicción masiva en producción
    * **Eventos Kafka**: Publica eventos de registro, desregistro y cambio de estado en 3 topics
    
    ## Autenticación
    * **Dashboard Eureka** (`/`): Basic Auth obligatorio en producción (`EUREKA_USER`/`EUREKA_PASSWORD`)
    * **Registry API** (`/eureka/apps/**`): Basic Auth para consultas GET
    * **Eureka Protocol** (`/eureka/apps/**` POST/PUT/DELETE): Eureka Auth para clientes registrados
    * **Actuator** (`/actuator/**`): Sin autenticación, accesible para health checks y load balancers
    
    ## Convenciones
    * Nombres de aplicación en MAYÚSCULAS (ej. `ACCOUNTS-SERVICE`)
    * Instance ID formato: `service-name:ip:port`
    * Metadata estándar: `version`, `zone`, `api.version`, `canary`, `weight`, `deployment.environment`
    
    ## Eventos Kafka (Outbound)
    * `yanki.discovery.instance.registered.v1` — Instancia registrada exitosamente
    * `yanki.discovery.instance.deregistered.v1` — Instancia desregistrada o evictada
    * `yanki.discovery.instance.status.changed.v1` — Cambio de estado (UP → DOWN, etc.)
  contact:
    name: Platform Team - Service Discovery
    email: platform-discovery@yanki.internal
    url: https://github.com/yanki/discovery-service
  license:
    name: Proprietary
    url: https://yanki.internal/license
servers:
  - url: http://localhost:8761
    description: Servidor de desarrollo local
  - url: https://discovery.yanki.internal
    description: Producción (HTTPS via Gateway)
externalDocs:
  description: Documentación completa de la plataforma Yanki
  url: https://github.com/yanki/discovery-service/wiki
tags:
  - name: Eureka Registry
    description: Consulta de servicios e instancias registradas en Eureka
  - name: Eureka Protocol
    description: Endpoints internos del protocolo Eureka (clientes Eureka)
  - name: Health
    description: Health checks del Eureka Server
  - name: Error Handling
    description: Manejador global de excepciones - respuestas de error estandarizadas
security:
  - basicAuth: []
paths:
  /eureka/apps:
    get:
      tags:
        - Eureka Registry
      summary: Obtiene el registry completo de Eureka
      description: |
        Retorna todas las aplicaciones registradas con sus instancias y metadata completa.
        
        **Uso típico:** Monitoreo, debugging, descubrimiento manual de servicios.
        
        **Respuesta incluye:**
        - Lista de aplicaciones con contador de instancias
        - Por instancia: Instance ID, Host, Port, Status, Metadata, Lease timestamps
        - Métricas globales: total, UP, DOWN, self-preservation mode
        
        **Casos de Prueba:** CP-170 (Gateway fetch registry), CP-173 (HA Cluster self-preservation)
      operationId: getRegistry
      security:
        - basicAuth: []
      responses:
        '200':
          description: Registry obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EurekaRegistryResponse'
              example:
                applications:
                  - name: ACCOUNTS-SERVICE
                    instances:
                      - instanceId: accounts-service:172.20.0.5:8083
                        appName: ACCOUNTS-SERVICE
                        hostName: 172.20.0.5
                        ipAddress: 172.20.0.5
                        port: 8083
                        securePort: 8443
                        status: UP
                        metadata:
                          version: "1.0.0"
                          zone: primary
                          api.version: v1
                          canary: "false"
                          weight: "100"
                          deployment.environment: docker
                          management.port: "8083"
                        lastRenewalTimestamp: 1731590400000
                        registrationTimestamp: 1731590355000
                        evictionTimestamp: 0
                        canary: false
                        zone: primary
                        apiVersion: v1
                        weight: 100
                        version: "1.0.0"
                lastUpdatedTimestamp: 1731590400000
                selfPreservationMode: false
                totalInstances: 1
                instancesUp: 1
                instancesDown: 0
        '401':
          description: No autenticado - Credenciales Basic Auth requeridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 401
                error: Unauthorized
                code: UNAUTHORIZED
                message: "No autenticado - Credenciales Basic Auth requeridas"
                path: /eureka/apps
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 500
                error: Internal Server Error
                code: INTERNAL_SERVER_ERROR
                message: "Error interno del servidor"
                path: /eureka/apps
                details:
                  exception: RuntimeException
    post:
      tags:
        - Eureka Protocol
      summary: Registrar instancia en Eureka
      description: |
        Endpoint interno para registro automático de clientes Eureka al arrancar.
        
        **Flujo:**
        1. Cliente Eureka inicia y obtiene config de Config Server
        2. Cliente envía POST con InstanceInfo completo + metadata
        3. Eureka Server valida, persiste en registry, retorna 204
        4. Cliente inicia heartbeats cada 10s (PUT)
        
        **Metadata obligatoria en request:**
        - `instanceId`: Formato `service:ip:port`
        - `hostName`, `ipAddr`, `port`, `securePort`
        - `metadata`: version, zone, api.version, canary, weight, deployment.environment, management.port
        
        **Casos de Prueba:** CP-166 (Registro exitoso)
      operationId: registerInstance
      security:
        - eurekaAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          description: Nombre de la aplicación en MAYÚSCULAS
          schema:
            type: string
            pattern: '^[A-Z0-9-]+$'
          example: ACCOUNTS-SERVICE
      requestBody:
        required: true
        description: Información completa de la instancia a registrar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EurekaInstanceRequest'
            example:
              instanceId: accounts-service:172.20.0.5:8083
              hostName: 172.20.0.5
              ipAddress: 172.20.0.5
              port: 8083
              securePort: 8443
              metadata:
                version: "1.0.0"
                zone: primary
                api.version: v1
                canary: "false"
                weight: "100"
                deployment.environment: docker
                management.port: "8083"
      responses:
        '204':
          description: Instancia registrada exitosamente (No Content)
        '400':
          description: "Bad Request - Metadata de instancia inválida o incompleta (code: INVALID_INSTANCE_METADATA)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 400
                error: Bad Request
                code: INVALID_INSTANCE_METADATA
                message: "Metadata incompleta: faltan campos obligatorios"
                path: /eureka/apps/ACCOUNTS-SERVICE
        '401':
          description: No autenticado - Credenciales Eureka requeridas en producción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: "Conflict - Self-preservation mode activado inesperadamente (code: SELF_PRESERVATION_UNEXPECTED)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 409
                error: Conflict
                code: SELF_PRESERVATION_UNEXPECTED
                message: "Self-preservation mode activado inesperadamente"
                path: /eureka/apps/ACCOUNTS-SERVICE
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /eureka/apps/{appName}:
    get:
      tags:
        - Eureka Registry
      summary: Obtiene instancias de una aplicación
      description: |
        Retorna todas las instancias (UP y DOWN) de la aplicación especificada.
        
        **Parámetros:**
        - `appName`: Nombre de la aplicación en MAYÚSCULAS (ej. `ACCOUNTS-SERVICE`)
        
        **Respuesta:** Array de instancias con metadata completa.
        
        **Casos de Prueba:** CP-166 (Registro de servicio), CP-170 (Gateway fetch), CP-174 (Metadata)
      operationId: getApplicationInstances
      security:
        - basicAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          description: Nombre de la aplicación en MAYÚSCULAS
          schema:
            type: string
            pattern: '^[A-Z0-9-]+$'
          example: ACCOUNTS-SERVICE
      responses:
        '200':
          description: Instancias obtenidas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EurekaInstanceResponse'
              example:
                - instanceId: accounts-service:172.20.0.5:8083
                  appName: ACCOUNTS-SERVICE
                  hostName: 172.20.0.5
                  ipAddress: 172.20.0.5
                  port: 8083
                  securePort: 8443
                  status: UP
                  metadata:
                    version: "1.0.0"
                    zone: primary
                    api.version: v1
                    canary: "false"
                    weight: "100"
                    deployment.environment: docker
                    management.port: "8083"
                  lastRenewalTimestamp: 1731590400000
                  registrationTimestamp: 1731590355000
                  evictionTimestamp: 0
                  canary: false
                  zone: primary
                  apiVersion: v1
                  weight: 100
                  version: "1.0.0"
        '401':
          description: No autenticado - Credenciales Basic Auth requeridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Aplicación no encontrada en el registry (code: APPLICATION_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 404
                error: Not Found
                code: APPLICATION_NOT_FOUND
                message: "Aplicación no encontrada en el registry: NONEXISTENT-SERVICE"
                path: /eureka/apps/NONEXISTENT-SERVICE

  /eureka/apps/{appName}/healthy:
    get:
      tags:
        - Eureka Registry
      summary: Obtiene instancias healthy de una aplicación
      description: |
        Retorna solo instancias con status UP, útil para load balancing.
        
        **Diferencia con `/apps/{appName}`:** Filtra solo instancias `status=UP`.
        Ideal para API Gateway y clientes que necesitan endpoints saludables.
        
        **Casos de Prueba:** CP-170 (Gateway fetch - solo instancias healthy para routing)
      operationId: getHealthyInstances
      security:
        - basicAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          description: Nombre de la aplicación en MAYÚSCULAS
          schema:
            type: string
            pattern: '^[A-Z0-9-]+$'
          example: ACCOUNTS-SERVICE
      responses:
        '200':
          description: Instancias healthy obtenidas (solo status=UP)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EurekaInstanceResponse'
              example:
                - instanceId: accounts-service:172.20.0.5:8083
                  appName: ACCOUNTS-SERVICE
                  hostName: 172.20.0.5
                  ipAddress: 172.20.0.5
                  port: 8083
                  securePort: 8443
                  status: UP
                  metadata:
                    version: "1.0.0"
                    zone: primary
                    api.version: v1
                    canary: "false"
                    weight: "100"
                    deployment.environment: docker
                    management.port: "8083"
                  lastRenewalTimestamp: 1731590400000
                  registrationTimestamp: 1731590355000
                  evictionTimestamp: 0
                  canary: false
                  zone: primary
                  apiVersion: v1
                  weight: 100
                  version: "1.0.0"
        '401':
          description: No autenticado - Credenciales Basic Auth requeridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /eureka/apps/{appName}/{instanceId}:
    get:
      tags:
        - Eureka Registry
      summary: Obtiene una instancia por ID
      description: |
        Retorna el detalle de una instancia específica.
        
        **Parámetros:**
        - `appName`: Nombre de la aplicación (ej. `ACCOUNTS-SERVICE`)
        - `instanceId`: ID completo formato `service-name:ip:port` (ej. `accounts-service:172.20.0.5:8083`)
        
        **Casos de Prueba:** CP-166 (Registro de servicio), CP-167 (Heartbeat timestamps), CP-174 (Metadata completa)
      operationId: getInstanceById
      security:
        - basicAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          description: Nombre de la aplicación en MAYÚSCULAS
          schema:
            type: string
            pattern: '^[A-Z0-9-]+$'
          example: ACCOUNTS-SERVICE
        - name: instanceId
          in: path
          required: true
          description: 'Identificador único de la instancia (formato: service:ip:port)'
          schema:
            type: string
          example: accounts-service:172.20.0.5:8083
      responses:
        '200':
          description: Instancia encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EurekaInstanceResponse'
              example:
                instanceId: accounts-service:172.20.0.5:8083
                appName: ACCOUNTS-SERVICE
                hostName: 172.20.0.5
                ipAddress: 172.20.0.5
                port: 8083
                securePort: 8443
                status: UP
                metadata:
                  version: "1.0.0"
                  zone: primary
                  api.version: v1
                  canary: "false"
                  weight: "100"
                  deployment.environment: docker
                  management.port: "8083"
                lastRenewalTimestamp: 1731590400000
                registrationTimestamp: 1731590355000
                evictionTimestamp: 0
                canary: false
                zone: primary
                apiVersion: v1
                weight: 100
                version: "1.0.0"
        '401':
          description: No autenticado - Credenciales Basic Auth requeridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Instancia no encontrada en el registry (code: INSTANCE_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 404
                error: Not Found
                code: INSTANCE_NOT_FOUND
                message: "Instancia no encontrada: nonexistent:0.0.0.0:0"
                path: /eureka/apps/ACCOUNTS-SERVICE/nonexistent:0.0.0.0:0
    put:
      tags:
        - Eureka Protocol
      summary: Renovar lease (heartbeat)
      description: |
        Endpoint interno para heartbeat periódico de clientes Eureka.
        
        **Frecuencia:** Cada 10 segundos (configurable en cliente: `lease-renewal-interval-in-seconds`)
        
        **Comportamiento:**
        - Actualiza `lastRenewalTimestamp` en registry
        - Mantiene status UP si health check OK
        - Si 3 heartbeats fallidos (30s) → marca DOWN → evicción tras intervalo
        
        **Casos de Prueba:** CP-167 (Heartbeat y renovación de lease)
      operationId: renewLease
      security:
        - eurekaAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          description: Nombre de la aplicación en MAYÚSCULAS
          schema:
            type: string
            pattern: '^[A-Z0-9-]+$'
          example: ACCOUNTS-SERVICE
        - name: instanceId
          in: path
          required: true
          description: 'Identificador único de la instancia (formato: service:ip:port)'
          schema:
            type: string
          example: accounts-service:172.20.0.5:8083
      responses:
        '200':
          description: Lease renovado exitosamente
        '401':
          description: No autenticado - Credenciales Eureka requeridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Instancia no encontrada en el registry (code: INSTANCE_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 404
                error: Not Found
                code: INSTANCE_NOT_FOUND
                message: "Instancia no encontrada: nonexistent:0.0.0.0:0"
                path: /eureka/apps/ACCOUNTS-SERVICE/nonexistent:0.0.0.0:0
        '410':
          description: Gone - Instancia expirada y evictada del registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - Eureka Protocol
      summary: Desregistrar instancia de Eureka
      description: |
        Endpoint interno para desregistro graceful de clientes Eureka.
        
        **Flujo:**
        1. Cliente recibe señal de terminación (SIGTERM)
        2. Cliente envía DELETE a su propia instancia
        3. Eureka elimina del registry inmediatamente
        4. Publica evento `yanki.discovery.instance.deregistered.v1`
        5. Réplica desregistro a peers (HA cluster)
        
        **Nota de Idempotencia:** El desregistro es idempotente: si la instancia ya no existe, retorna 200 sin error.
        
        **Casos de Prueba:** CP-166 (Desregistro graceful), CP-168 (Detección y evicción)
      operationId: deregisterInstance
      security:
        - eurekaAuth: []
      parameters:
        - name: appName
          in: path
          required: true
          description: Nombre de la aplicación en MAYÚSCULAS
          schema:
            type: string
            pattern: '^[A-Z0-9-]+$'
          example: ACCOUNTS-SERVICE
        - name: instanceId
          in: path
          required: true
          description: 'Identificador único de la instancia (formato: service:ip:port)'
          schema:
            type: string
          example: accounts-service:172.20.0.5:8083
      responses:
        '200':
          description: Instancia desregistrada exitosamente
        '401':
          description: No autenticado - Credenciales Eureka requeridas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Instancia no encontrada - Idempotente, no falla si ya no existe (code: INSTANCE_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T10:30:45.123Z"
                status: 404
                error: Not Found
                code: INSTANCE_NOT_FOUND
                message: "Instancia no encontrada (idempotente): nonexistent:0.0.0.0:0"
                path: /eureka/apps/ACCOUNTS-SERVICE/nonexistent:0.0.0.0:0

  /actuator/health:
    get:
      tags:
        - Health
      summary: Health check del Eureka Server
      description: |
        Verifica el estado del servidor Eureka y el registry.
        
        **Lógica de determinación de status:**
        - `UP`: Registry operativo, al menos una instancia UP
        - `DOWN`: Todas las instancias DOWN o registry vacío con instancias registradas
        - `OUT_OF_SERVICE`: Registry vacío (ningún servicio registrado)
        
        **Componentes verificados:**
        - `eureka`: Estado del registry (instancias UP/DOWN, self-preservation)
        - `diskSpace`: Espacio en disco del contenedor
        
        **Uso en Docker:**
        ```yaml
        healthcheck:
          test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 20s
        ```
        
        **Casos de Prueba:** CP-171 (Health indicators personalizados), CP-172 (Dashboard security - accesible sin auth)
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Health check completado (status puede ser UP, DOWN, OUT_OF_SERVICE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EurekaHealthResponse'
              examples:
                up:
                  summary: Eureka Server UP - Instancias saludables
                  value:
                    status: UP
                    components:
                      eureka:
                        status: UP
                        details:
                          totalInstances: 1
                          instancesUp: 1
                          instancesDown: 0
                          selfPreservationMode: false
                      diskSpace:
                        status: UP
                        details:
                          total: 2147483648
                          free: 1073741824
                    timestamp: 1731590400000
                down:
                  summary: Eureka Server DOWN - Todas las instancias DOWN
                  value:
                    status: DOWN
                    components:
                      eureka:
                        status: DOWN
                        details:
                          totalInstances: 1
                          instancesUp: 0
                          instancesDown: 1
                          selfPreservationMode: false
                      diskSpace:
                        status: UP
                        details:
                          total: 2147483648
                          free: 1073741824
                    timestamp: 1731590400000
                out_of_service:
                  summary: Eureka Server OUT_OF_SERVICE - Registry vacío
                  value:
                    status: OUT_OF_SERVICE
                    components:
                      eureka:
                        status: OUT_OF_SERVICE
                        details:
                          totalInstances: 0
                          instancesUp: 0
                          instancesDown: 0
                          selfPreservationMode: false
                      diskSpace:
                        status: UP
                        details:
                          total: 2147483648
                          free: 1073741824
                    timestamp: 1731590400000
        '503':
          description: Servicio no disponible (status DOWN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /actuator/info:
    get:
      tags:
        - Health
      summary: Información del servicio
      description: |
        Retorna información básica del servicio: nombre, versión, descripción, puerto.
        
        **Sin autenticación requerida.**
        
        **Casos de Prueba:** CP-171 (Health indicators - complementario al health check)
      operationId: serviceInfo
      security: []
      responses:
        '200':
          description: Información del servicio
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: discovery-service
                  version:
                    type: string
                    example: "1.0.0"
                  description:
                    type: string
                    example: Eureka Server para Service Discovery
                  port:
                    type: integer
                    example: 8761
              example:
                service: discovery-service
                version: "1.0.0"
                description: Eureka Server para Service Discovery
                port: 8761

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Autenticación Basic Auth para Dashboard Eureka y endpoints protegidos (/eureka/apps/** GET)
    eurekaAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Credenciales Eureka para clientes registrados (POST/PUT/DELETE /eureka/apps/**)

  schemas:
    ApiError:
      type: object
      description: "Respuesta de error estandarizada para toda la API. Formato unificado: timestamp, status, error, code, message, path, details."
      required:
        - timestamp
        - status
        - error
        - code
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp del error (ISO-8601)
          example: "2026-11-14T10:30:45.123Z"
        status:
          type: integer
          format: int32
          description: Código de estado HTTP
          example: 404
        error:
          type: string
          description: Nombre del error HTTP
          example: Not Found
        code:
          type: string
          description: Código de error de negocio único
          example: INSTANCE_NOT_FOUND
        message:
          type: string
          description: Mensaje descriptivo para el cliente
          example: "Instancia no encontrada: accounts-service:172.20.0.5:8083"
        path:
          type: string
          description: Path de la request que generó el error
          example: /eureka/apps/ACCOUNTS-SERVICE/instance-id
        details:
          type: object
          description: Detalles técnicos adicionales
          additionalProperties: true
      example:
        timestamp: "2026-11-14T10:30:45.123Z"
        status: 404
        error: Not Found
        code: INSTANCE_NOT_FOUND
        message: "Instancia no encontrada: accounts-service:172.20.0.5:8083"
        path: /eureka/apps/ACCOUNTS-SERVICE/accounts-service:172.20.0.5:8083

    EurekaRegistryResponse:
      type: object
      description: Estado completo del registry de Eureka
      required:
        - applications
        - lastUpdatedTimestamp
        - selfPreservationMode
        - totalInstances
        - instancesUp
        - instancesDown
      properties:
        applications:
          type: array
          description: Lista de aplicaciones con sus instancias
          items:
            $ref: '#/components/schemas/ApplicationResponse'
        lastUpdatedTimestamp:
          type: integer
          format: int64
          description: Timestamp de última actualización (epoch millis)
          example: 1731590400000
        selfPreservationMode:
          type: boolean
          description: Modo self-preservation activo
          example: false
        totalInstances:
          type: integer
          format: int32
          description: Total de instancias registradas
          example: 15
        instancesUp:
          type: integer
          format: int32
          description: Instancias con status UP
          example: 14
        instancesDown:
          type: integer
          format: int32
          description: Instancias con status DOWN
          example: 1

    ApplicationResponse:
      type: object
      description: Aplicación registrada con sus instancias
      required:
        - name
        - instances
      properties:
        name:
          type: string
          description: Nombre de la aplicación
          example: ACCOUNTS-SERVICE
        instances:
          type: array
          description: Instancias de la aplicación
          items:
            $ref: '#/components/schemas/EurekaInstanceResponse'

    EurekaInstanceResponse:
      type: object
      description: "Información de una instancia registrada en Eureka. Expone solo los campos necesarios para la API REST, ocultando detalles internos."
      required:
        - instanceId
        - appName
        - hostName
        - ipAddress
        - port
        - securePort
        - status
        - metadata
        - lastRenewalTimestamp
        - registrationTimestamp
        - evictionTimestamp
        - canary
        - zone
        - apiVersion
        - weight
        - version
      properties:
        instanceId:
          type: string
          description: Identificador único de la instancia
          example: accounts-service:172.20.0.5:8083
        appName:
          type: string
          description: Nombre de la aplicación
          example: ACCOUNTS-SERVICE
        hostName:
          type: string
          description: Hostname del host
          example: 172.20.0.5
        ipAddress:
          type: string
          description: Dirección IP
          example: 172.20.0.5
        port:
          type: integer
          format: int32
          description: Puerto HTTP
          example: 8083
        securePort:
          type: integer
          format: int32
          description: Puerto HTTPS
          example: 8443
        status:
          type: string
          description: Estado de la instancia
          enum:
            - UP
            - DOWN
            - STARTING
            - OUT_OF_SERVICE
            - UNKNOWN
          example: UP
        metadata:
          type: object
          description: Metadata rica de la instancia (version, zone, api.version, canary, weight, ...)
          additionalProperties:
            type: string
          example:
            version: "1.0.0"
            zone: primary
            api.version: v1
            canary: "false"
            weight: "100"
            deployment.environment: docker
            management.port: "8083"
        lastRenewalTimestamp:
          type: integer
          format: int64
          description: Timestamp del último heartbeat (epoch millis)
          example: 1731590400000
        registrationTimestamp:
          type: integer
          format: int64
          description: Timestamp de registro inicial (epoch millis)
          example: 1731590355000
        evictionTimestamp:
          type: integer
          format: int64
          description: Timestamp de expiración del lease (epoch millis)
          example: 1731590430000
        canary:
          type: boolean
          description: Indica si la instancia es canary deployment
          example: false
        zone:
          type: string
          description: Zona de disponibilidad
          example: primary
        apiVersion:
          type: string
          description: Versión de API expuesta
          example: v1
        weight:
          type: integer
          format: int32
          description: Peso para weighted load balancing
          example: 100
        version:
          type: string
          description: Versión del servicio
          example: "1.0.0"

    EurekaInstanceRequest:
      type: object
      description: "Datos de instancia para registro en Eureka. Define la estructura esperada en el body del POST /eureka/apps/{appName}."
      required:
        - instanceId
        - hostName
        - ipAddress
        - port
        - metadata
      properties:
        instanceId:
          type: string
          description: Identificador único de la instancia
          pattern: '^[a-z0-9-]+:[0-9.]+:[0-9]+$'
          example: accounts-service:172.20.0.5:8083
        hostName:
          type: string
          description: Hostname del host
          example: 172.20.0.5
        ipAddress:
          type: string
          description: Dirección IPv4 del host
          pattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$'
          example: 172.20.0.5
        port:
          type: integer
          format: int32
          description: Puerto HTTP de la instancia
          minimum: 1
          maximum: 65535
          example: 8083
        securePort:
          type: integer
          format: int32
          description: Puerto HTTPS de la instancia (opcional)
          minimum: 1
          maximum: 65535
          example: 8443
        metadata:
          type: object
          description: Metadata rica de la instancia
          additionalProperties:
            type: string
          example:
            version: "1.0.0"
            zone: primary
            api.version: v1
            canary: "false"
            weight: "100"
            deployment.environment: docker
            management.port: "8083"

    EurekaHealthResponse:
      type: object
      description: Health check del Eureka Server
      required:
        - status
        - components
        - timestamp
      properties:
        status:
          type: string
          description: Estado general
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
          example: UP
        components:
          type: object
          description: Detalles de componentes
          additionalProperties:
            $ref: '#/components/schemas/ComponentHealth'
        timestamp:
          type: integer
          format: int64
          description: Timestamp del check (epoch millis)
          example: 1731590400000

    ComponentHealth:
      type: object
      description: Salud de un componente individual
      required:
        - status
        - details
      properties:
        status:
          type: string
          description: Estado del componente
          example: UP
        details:
          type: object
          description: Detalles adicionales
          additionalProperties: true
